services:
  neon-local:
    image: postgres:16-alpine
    container_name: neon-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neondb
    ports:
      - "5432:5432"
    volumes:
      - neon_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neondb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neon_local_data:
